name: Import RustDesk while preserving VANTA server

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustdesk-import-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VANTA repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import upstream RustDesk source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/rustdesk/rustdesk.git /tmp/rustdesk
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/server/' \
            --exclude='/.github/workflows/' \
            /tmp/rustdesk/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import upstream RustDesk source; preserve VANTA server"
          git push origin HEAD:main
