name: Build VANTA RustDesk Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'libs/**'
      - 'flutter/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.py'
      - 'build.rs'
      - '.github/workflows/build-rustdesk-android.yml'
      - '.github/patches/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: '1.75'
  FLUTTER_VERSION: '3.24.4'
  NDK_VERSION: 'r28c'
  CARGO_NDK_VERSION: '3.1.2'
  CARGO_EXPAND_VERSION: '1.0.95'
  FLUTTER_RUST_BRIDGE_VERSION: '1.80.1'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  VERSION: '1.5.3'

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore RustDesk hbb_common dependency
        shell: bash
        run: |
          git clone https://github.com/rustdesk/hbb_common.git libs/hbb_common
          git -C libs/hbb_common checkout fae47e024dd83cef6aaecde0aa7d11731df11649

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config tree wget

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch Flutter
        shell: bash
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply "${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install Android native dependencies
        shell: bash
        run: ./flutter/build_android_deps.sh arm64-v8a

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android
          components: rustfmt

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rustdesk-1.5.3-android-arm64

      - name: Install cargo-expand
        shell: bash
        run: |
          set -euxo pipefail
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked

      - name: Install Flutter Rust Bridge code generator
        shell: bash
        run: |
          set -euxo pipefail
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features uuid --locked

      - name: Resolve Flutter packages
        shell: bash
        run: |
          set -euxo pipefail
          cd flutter
          flutter pub get

      - name: Generate Flutter Rust bridge
        shell: bash
        run: |
          set -euxo pipefail
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Build RustDesk native library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" ./flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Configure Maven Central mirror
        shell: bash
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/maven-mirror.gradle <<'EOF'
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
              }
          }
          EOF

      - name: Build VANTA Android APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' ./flutter/android/gradle.properties
          sed -i 's/signingConfigs.release/signingConfigs.debug/g' ./flutter/android/app/build.gradle
          export PATH="/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH"
          cd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../artifacts/VANTA-MANW-RustDesk-Android-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-MANW-RustDesk-Android
          path: artifacts/VANTA-MANW-RustDesk-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14
